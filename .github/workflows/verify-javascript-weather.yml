name: Radius - Verify JavaScript weather

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Radius GitHub Environment'
        required: true
        default: javascript-weather-demo

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install AKS login plugin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: 'v0.2.19'

      - name: Verify frontend and proxied forecast
        env:
          NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl -n "$NAMESPACE" rollout status deployment/weather-api --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/react-weather --timeout=180s

          kubectl -n "$NAMESPACE" port-forward service/react-weather-react 18080:8080 > /tmp/radius-weather-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:18080/ | grep -q '<title>React Weather'
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/weatherforecast \
            | jq -e 'length == 5 and all(.[]; has("date") and has("temperatureC") and has("summary"))'
